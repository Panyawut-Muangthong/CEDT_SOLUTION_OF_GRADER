<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Reviewer</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Highlight.js for C++ Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- Column 1: Problem List -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Questions</h2>
                <!-- ADDED FILTER LABEL & CONTROLS -->
                <div style="font-size: 12px; color: var(--text-main); margin-bottom: -4px;">Filter problems:</div>
                <div class="filter-container">
                    <select id="tag-filter" class="filter-dropdown" onchange="renderProblemList()">
                        <option value="all">All Tags</option>
                    </select>
                    <select id="star-filter" class="filter-dropdown" onchange="renderProblemList()">
                        <option value="all">All Stars</option>
                        <option value="1">⭐ 1 Star</option>
                        <option value="2">⭐⭐ 2 Stars</option>
                        <option value="3">⭐⭐⭐ 3 Stars</option>
                        <option value="4">⭐⭐⭐⭐ 4 Stars</option>
                        <option value="5">⭐⭐⭐⭐⭐ 5 Stars</option>
                    </select>
                </div>
            </div>
            <div class="problem-list" id="problem-list">
                <!-- Problems will be injected here by JavaScript -->
            </div>
        </aside>

        <!-- Column 2: PDF Viewer -->
        <!-- (Leave your PDF viewer main section exactly as it is) -->
        <main class="pdf-viewer">
            <div class="panel-header">
                <h3 id="pdf-title">Select a problem...</h3>
            </div>
            <div class="iframe-container">
                <iframe id="pdf-frame" src="" title="PDF Viewer"></iframe>
                <div id="pdf-placeholder" class="placeholder">PDF will appear here</div>
            </div>
        </main>

        <!-- Column 3: Solution & Description -->
        <aside class="solution-viewer">
            <div class="panel-header tabs">
                <div class="tab-group">
                    <!-- SWAPPED: Description is now first (left), Code is second (right) -->
                    <button class="tab-btn active" onclick="toggleView('desc')">Description</button>
                    <button class="tab-btn" onclick="toggleView('code')">C++ Solution</button>
                </div>
                
                <!-- UI TOGGLE SWITCH -->
                <div class="toggle-wrapper">
                    <span id="toggle-label" class="toggle-label">Reveal</span>
                    <label class="switch">
                        <input type="checkbox" id="blur-toggle-checkbox" onchange="toggleCodeBlur()">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            
            <div class="content-area">
                <!-- Code View (Removed 'active' class) -->
                <div id="view-code" class="view-panel">
                    <pre><code id="cpp-code" class="language-cpp blurred-content">// Source code will appear here</code></pre>
                </div>

                <!-- Description View (Added 'active' class) -->
                <div id="view-desc" class="view-panel active">
                    <div id="desc-text" class="description-content">
                        Description will appear here
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
