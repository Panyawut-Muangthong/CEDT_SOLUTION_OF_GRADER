<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Reviewer</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Highlight.js for C++ Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/cpp.min.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- Column 1: Problem List -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Questions</h2>
            </div>
            <div class="problem-list" id="problem-list">
                <!-- Problems will be injected here by JavaScript -->
            </div>
        </aside>

        <!-- Column 2: PDF Viewer -->
        <main class="pdf-viewer">
            <div class="panel-header">
                <h3 id="pdf-title">Select a problem...</h3>
            </div>
            <div class="iframe-container">
                <iframe id="pdf-frame" src="" title="PDF Viewer"></iframe>
                <div id="pdf-placeholder" class="placeholder">PDF will appear here</div>
            </div>
        </main>

        <!-- Column 3: Solution & Description -->
        <aside class="solution-viewer">
            <div class="panel-header tabs">
                <button class="tab-btn active" onclick="toggleView('code')">C++ Solution</button>
                <button class="tab-btn" onclick="toggleView('desc')">Description</button>
            </div>
            
            <div class="content-area">
                <!-- Code View -->
                <div id="view-code" class="view-panel active">
                    <pre><code id="cpp-code" class="language-cpp">// Source code will appear here</code></pre>
                </div>

                <!-- Description View -->
                <div id="view-desc" class="view-panel">
                    <div id="desc-text" class="description-content">
                        Description will appear here
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
